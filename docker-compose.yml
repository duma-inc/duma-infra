services:
  api:
    build: ../duma-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/duma_db
      SPRING_DATASOURCE_USERNAME: duma
      SPRING_DATASOURCE_PASSWORD: 163duma
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_URL: jdbc:postgresql://db:5432/duma_db
      SPRING_FLYWAY_USER: duma
      SPRING_FLYWAY_PASSWORD: 163duma
      SPRING_FLYWAY_LOCATIONS: classpath:db/migrations
      SPRING_FLYWAY_CONNECT_RETRIES: 30
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_MONGODB_URI: mongodb://duma:163duma@mongodb:27017/duma_db?authSource=admin
      SPRING_DATA_MONGODB_URI: mongodb://duma:163duma@mongodb:27017/duma_db?authSource=admin
      DUMA_ENGINE_BASE_URL: http://engine:3333
      DUMA_JWT_ISSUER_URI: http://${HOST_IP}:8081/realms/duma-realm
      DUMA_JWT_JWK_SET_URI: http://keycloak:8080/realms/duma-realm/protocol/openid-connect/certs
      SPRING_PROFILES_ACTIVE: docker
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: duma-realm
      KEYCLOAK_ADMIN_USERNAME: duma
      KEYCLOAK_ADMIN_PASSWORD: 163duma
      SERVER_TOMCAT_MAX_HTTP_HEADER_SIZE: 65536
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
      engine:
        condition: service_started
    restart: unless-stopped

  engine:
    build: ../duma-engine
    ports:
      - "${ENGINE_PORT:-3333}:3333"
    environment:
      NODE_ENV: production
      PORT: 3333
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
    restart: unless-stopped


  migrations:
    image: flyway/flyway:11.11.1
    command:
      - -url=jdbc:postgresql://db:5432/duma_db
      - -user=duma
      - -password=163duma
      - -connectRetries=30
      - -baselineOnMigrate=true
      - -locations=filesystem:/flyway/sql
      - migrate
    volumes:
      - ../duma-backend/src/main/resources/db/migrations:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
  ava:
    build:
      context: ../duma-ava
      args:
        - NEXT_PUBLIC_API_URL=${AVA_NEXT_PUBLIC_API_URL:-https://ava.dumaway.com/api}
        - NEXT_PUBLIC_KEYCLOAK_ISSUER=${NEXT_PUBLIC_KEYCLOAK_ISSUER:-https://auth.dumaway.com/realms/duma-realm}
        - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=${AVA_KEYCLOAK_CLIENT_ID:-duma-web}
        - NEXTAUTH_URL=${AVA_NEXTAUTH_URL:-https://ava.dumaway.com}
    ports:
      - "${AVA_PORT:-3001}:3000"
    environment:
      - NEXTAUTH_URL=${AVA_NEXTAUTH_URL:-https://ava.dumaway.com}
      - AUTH_URL=${AVA_NEXTAUTH_URL:-https://ava.dumaway.com}
      - NEXTAUTH_SECRET=${AVA_NEXTAUTH_SECRET:-minhasenhasupersecreta123}
      - AUTH_SECRET=${AVA_NEXTAUTH_SECRET:-minhasenhasupersecreta123}
      - KEYCLOAK_CLIENT_ID=${AVA_KEYCLOAK_CLIENT_ID:-duma-web}
      - KEYCLOAK_CLIENT_SECRET=${AVA_KEYCLOAK_CLIENT_SECRET:-G4Ly9ch6G40MOIjpbrjbmENPnfb7HgsA}
      - KEYCLOAK_ISSUER=${AVA_KEYCLOAK_ISSUER:-https://auth.dumaway.com/realms/duma-realm}
      - KEYCLOAK_ISSUER_INTERNAL=${KEYCLOAK_ISSUER_INTERNAL:-http://keycloak:8080/realms/duma-realm}
      - NEXT_PUBLIC_API_URL=${AVA_NEXT_PUBLIC_API_URL:-https://ava.dumaway.com/api}
      - NEXT_PUBLIC_KEYCLOAK_ISSUER=${NEXT_PUBLIC_KEYCLOAK_ISSUER:-https://auth.dumaway.com/realms/duma-realm}
      - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=${AVA_KEYCLOAK_CLIENT_ID:-duma-web}
    depends_on:
      - api
      - keycloak
    restart: unless-stopped

  adm:
    build:
      context: ../duma-adm
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://adm.dumaway.com/api}
        - NEXT_PUBLIC_KEYCLOAK_ISSUER=${NEXT_PUBLIC_KEYCLOAK_ISSUER:-https://auth.dumaway.com/realms/duma-realm}
        - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-duma-adm}
        - NEXTAUTH_URL=${NEXTAUTH_URL:-https://adm.dumaway.com}
    ports:
      - "${ADM_PORT:-3012}:3002"
    environment:
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://adm.dumaway.com}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-minhasenhasupersecreta123}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-duma-adm}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-14KouZxVwvRcOTLe1vvw6HOiORdw0fLw}
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER:-https://auth.dumaway.com/realms/duma-realm}
      - KEYCLOAK_ISSUER_INTERNAL=${KEYCLOAK_ISSUER_INTERNAL:-http://keycloak:8080/realms/duma-realm}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://adm.dumaway.com/api}
      - NEXT_PUBLIC_KEYCLOAK_ISSUER=${NEXT_PUBLIC_KEYCLOAK_ISSUER:-https://auth.dumaway.com/realms/duma-realm}
      - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-duma-adm}
    depends_on:
      - api
      - keycloak
    restart: unless-stopped


  db:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: duma
      POSTGRES_PASSWORD: 163duma
      POSTGRES_DB: duma_db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duma -d duma_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: duma
      MONGO_INITDB_ROOT_PASSWORD: 163duma
      MONGO_INITDB_DATABASE: duma_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand({ ping: 1 }).ok' | mongosh mongodb://duma:163duma@localhost:27017/admin --quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: duma
      RABBITMQ_DEFAULT_PASS: 163duma
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_HTTP_PORT:-8088}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.simple.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - adm
      #   - ava
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: duma
      KC_BOOTSTRAP_ADMIN_PASSWORD: 163duma
      KC_HOSTNAME: http://${HOST_IP}:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak-theme/duma:/opt/keycloak/themes/duma
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_data:/opt/keycloak/data
    restart: unless-stopped

volumes:
  db_data:
  mongo_data:
  keycloak_data:
