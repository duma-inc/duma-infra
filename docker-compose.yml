services:
  api:
    build: ../duma-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/duma_db
      SPRING_DATASOURCE_USERNAME: duma
      SPRING_DATASOURCE_PASSWORD: 163duma
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_URL: jdbc:postgresql://db:5432/duma_db
      SPRING_FLYWAY_USER: duma
      SPRING_FLYWAY_PASSWORD: 163duma
      SPRING_FLYWAY_LOCATIONS: classpath:db/migrations
      SPRING_FLYWAY_CONNECT_RETRIES: 30
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_MONGODB_URI: mongodb://duma:163duma@mongodb:27017/duma_db?authSource=admin
      SPRING_DATA_MONGODB_URI: mongodb://duma:163duma@mongodb:27017/duma_db?authSource=admin
      DUMA_ENGINE_BASE_URL: http://engine:3333
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
      engine:
        condition: service_started
    restart: unless-stopped

  engine:
    build: ../duma-engine
    ports:
      - "${ENGINE_PORT:-3333}:3333"
    environment:
      NODE_ENV: production
      PORT: 3333
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
    restart: unless-stopped


  migrations:
    image: flyway/flyway:11.11.1
    command:
      - -url=jdbc:postgresql://db:5432/duma_db
      - -user=duma
      - -password=163duma
      - -connectRetries=30
      - -baselineOnMigrate=true
      - -locations=filesystem:/flyway/sql
      - migrate
    volumes:
      - ../duma-backend/src/main/resources/db/migrations:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
  # ava:
  #   build: ../duma-frontend-ava
  #   ports:
  #     - "3001:3001"

  # adm:
  #   build: ../duma-frontend-adm
  #   ports:
  #     - "3002:3002"

  db:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: duma
      POSTGRES_PASSWORD: 163duma
      POSTGRES_DB: duma_db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duma -d duma_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: duma
      MONGO_INITDB_ROOT_PASSWORD: 163duma
      MONGO_INITDB_DATABASE: duma_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand({ ping: 1 }).ok' | mongosh mongodb://duma:163duma@localhost:27017/admin --quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: duma
      RABBITMQ_DEFAULT_PASS: 163duma
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_HTTP_PORT:-8088}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.simple.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      #   - ava
      #   - adm
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: duma
      KC_BOOTSTRAP_ADMIN_PASSWORD: 163duma
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak-theme/duma:/opt/keycloak/themes/duma
      - keycloak_data:/opt/keycloak/data
    restart: unless-stopped

volumes:
  db_data:
  mongo_data:
  keycloak_data:
