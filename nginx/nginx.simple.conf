# ==============================================
# NGINX Configuration - Versão Simples
# ==============================================
# Todos os domínios têm TLS terminado no proxy externo
# (Cloudflare ou similar). Por isso X-Forwarded-Proto
# é fixado como "https" em todos os blocos.
# ==============================================

upstream api_backend {
    server api:8080;
}

upstream adm_backend {
    server adm:3002;
}

upstream ava_backend {
    server ava:3000;
}

upstream keycloak_backend {
    server keycloak:8080;
}

# ── ADM + API (adm.dumaway.com / localhost) ────
server {
    listen 80;
    server_name adm.dumaway.com localhost;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    client_max_body_size 100M;

    location /api/ {
        proxy_pass http://api_backend/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://adm_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# ── AVA (ava.dumaway.com) ──────────────────────
server {
    listen 80;
    server_name ava.dumaway.com;

    access_log /var/log/nginx/ava.access.log;
    error_log /var/log/nginx/ava.error.log;

    client_max_body_size 100M;

    location /api/ {
        proxy_pass http://api_backend/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://ava_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# ── Keycloak (auth.dumaway.com) ────────────────
server {
    listen 80;
    server_name auth.dumaway.com;

    access_log /var/log/nginx/auth.access.log;
    error_log /var/log/nginx/auth.error.log;

    client_max_body_size 10M;

    location / {
        proxy_pass http://keycloak_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
